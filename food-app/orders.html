<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FoodQA — My Orders</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="bg-flow"><div class="blob b1"></div><div class="blob b2"></div><div class="blob b3"></div><div class="bg-grid"></div></div>
<div id="loader"><div class="loader-food">📦</div><div class="loader-bar"><i></i></div></div>
<div id="appHeader"></div>
<main class="wrap page-anim">
  <div class="sec-head"><h2>📦 My Orders</h2><p>Your order history · Local time: <b id="ordersLiveClock">--</b> · auto-refreshes every second</p></div>
  <div id="ordersBox"></div>
</main>
<div id="appFooter"></div>
<script src="app.js"></script>
<script>
window.addEventListener('load',function(){setTimeout(function(){document.getElementById('loader').classList.add('done')},900)});
setTimeout(function(){document.getElementById('loader').classList.add('done')},2500);
FoodQA.mount('orders');
function updateOrdersClock(){var el=document.getElementById('ordersLiveClock');if(el)el.textContent=new Intl.DateTimeFormat(undefined,{dateStyle:'medium',timeStyle:'medium'}).format(new Date())}
updateOrdersClock();setInterval(updateOrdersClock,1000);
var orders=FoodQA.getOrders();
var box=document.getElementById('ordersBox');
if(!orders.length){box.innerHTML='<div class="empty"><span class="big">📦</span><b>No orders yet.</b><br>Your tasty orders will appear here.<br><a class="btn btn-orange" href="index.html" style="margin-top:16px">🍽️ Start Ordering</a></div>'}
else{
  var h='';
  orders.forEach(function(o,i){
    h+='<div class="order-card"><div style="display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px;align-items:center"><h4>Order #'+o.id+'</h4><span class="pill">● '+o.status+'</span></div><p style="color:var(--muted);font-size:12.5px;margin:6px 0 10px">'+o.time+' • '+o.pay+' • '+o.address+'</p>';
    o.items.forEach(function(it){h+='<div class="summary-row"><span>'+it.emoji+' '+it.name+' × '+it.qty+'</span><b>'+FoodQA.money(it.price*it.qty)+'</b></div>'});
    h+='<div class="summary-row total"><span>Total</span><span>'+FoodQA.money(o.total)+'</span></div>';
    if(i===0)h+='<a class="btn btn-primary btn-sm" href="tracking.html" style="margin-top:12px">🛵 Track Live</a>';
    h+='</div>';
  });
  box.innerHTML=h;
}
</script>
</body>
</html>
