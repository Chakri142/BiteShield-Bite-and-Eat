<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FoodQA — Restaurant Menu</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="bg-flow"><div class="blob b1"></div><div class="blob b2"></div><div class="blob b3"></div><div class="bg-grid"></div></div>
<div id="loader"><div class="loader-food">🍽️</div><div class="loader-bar"><i></i></div></div>
<div id="appHeader"></div>
<main class="wrap page-anim" id="mainWrap"></main>
<div id="appFooter"></div>
<script src="app.js"></script>
<script>
window.addEventListener('load',function(){setTimeout(function(){document.getElementById('loader').classList.add('done')},900)});
setTimeout(function(){document.getElementById('loader').classList.add('done')},2500);
FoodQA.mount('home');
var r=FoodQA.findRest(FoodQA.getParam('id'));
var wrap=document.getElementById('mainWrap');
if(!r){wrap.innerHTML='<div class="empty"><span class="big">😕</span><b>Restaurant not found.</b><br><a class="btn btn-orange" href="index.html" style="margin-top:16px">← Back to Restaurants</a></div>'}
else{
  var h='<a href="index.html" style="font-weight:800;color:var(--purple-dark);font-size:14px">← All Restaurants</a>';
  h+='<div class="menu-hero" style="margin-top:14px"><div class="big" style="background:'+r.bg+'">'+r.emoji+'</div><div style="flex:1;min-width:220px"><h2 style="color:var(--purple-deep);font-size:24px">'+r.name+'</h2><div class="rest-meta" style="margin:10px 0"><span class="pill">⭐ '+r.rating+'</span><span class="pill gray">⏱ '+r.time+'</span><span class="pill gray">📍 '+r.dist+'</span><span class="pill gray">'+r.price+'</span></div><div style="color:var(--muted);font-size:13.5px">'+r.cuisine+' • '+r.loc+' • '+r.offer+'</div></div><a class="btn btn-orange" data-cart-label href="cart.html">🛒 Cart ('+FoodQA.cartCount()+')</a></div>';
  h+='<div class="sec-head"><h2>📋 Menu — Prices &amp; Dishes</h2><p>Add items to cart, then checkout</p></div><div class="menu-grid">';
  r.items.forEach(function(it){
    h+='<div class="dish"><div class="di">'+it.emoji+'</div><h4>'+it.name+'</h4><p>'+it.desc+'</p><div class="row"><span class="price">'+FoodQA.money(it.price)+'</span><button class="add-btn" onclick="FoodQA.addToCart(\''+it.id+'\')">+ ADD</button></div></div>';
  });
  h+='</div>';
  wrap.innerHTML=h;
}
</script>
</body>
</html>
