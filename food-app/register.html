<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FoodQA — Register</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="bg-flow"><div class="blob b1"></div><div class="blob b2"></div><div class="blob b3"></div><div class="bg-grid"></div></div>
<div id="loader"><div class="loader-food">📝</div><div class="loader-bar"><i></i></div></div>
<div id="appHeader"></div>
<main class="wrap page-anim">
  <div class="auth-wrap">
    <div class="panel">
      <div class="auth-logo"><span class="big">🍔</span><h2 style="color:var(--purple-deep)">Create Account</h2><p style="color:var(--muted);font-size:14px;margin-top:5px">Join FoodQA — order in under 2 minutes!</p></div>
      <div class="form-error" id="errBox"></div>
      <div class="form-ok" id="okBox"></div>
      <form id="regForm">
        <div class="field"><label>👤 Full Name</label><input type="text" id="name" placeholder="Your name" required></div>
        <div class="field"><label>📧 Email Address</label><input type="email" id="email" placeholder="you@example.com" required></div>
        <div class="field"><label>📱 Phone Number</label><input type="tel" id="phone" placeholder="98765 43210" required></div>
        <div class="field"><label>🔒 Password (min 4 chars)</label><input type="password" id="pass" placeholder="Create password" required></div>
        <button class="btn btn-orange btn-block" type="submit">📝 Register →</button>
      </form>
      <p style="text-align:center;margin-top:18px;font-size:14px;color:var(--muted)">Already have an account? <a href="login.html" style="color:var(--purple-dark);font-weight:800">Login</a></p>
    </div>
  </div>
</main>
<div id="appFooter"></div>
<script src="app.js"></script>
<script>
window.addEventListener('load',function(){setTimeout(function(){document.getElementById('loader').classList.add('done')},900)});
setTimeout(function(){document.getElementById('loader').classList.add('done')},2500);
FoodQA.mount('login');
if(FoodQA.currentUser()){location.href='index.html'}
document.getElementById('regForm').addEventListener('submit',function(e){
  e.preventDefault();
  var name=document.getElementById('name').value.trim();
  var email=document.getElementById('email').value.trim().toLowerCase();
  var phone=document.getElementById('phone').value.trim();
  var pass=document.getElementById('pass').value;
  var err=document.getElementById('errBox');
  if(name.length<2){err.textContent='⚠️ Please enter your name.';err.classList.add('show');return}
  if(pass.length<4){err.textContent='⚠️ Password must be at least 4 characters.';err.classList.add('show');return}
  var res=FoodQA.registerUser(name,email,phone,pass);
  if(!res.ok){err.textContent='⚠️ '+res.msg;err.classList.add('show');return}
  err.classList.remove('show');
  var ok=document.getElementById('okBox');ok.textContent='✅ Account created! Welcome, '+name+'!';ok.classList.add('show');
  FoodQA.toast('🎉 Registered successfully!');
  setTimeout(function(){location.href='index.html'},1100);
});
</script>
</body>
</html>
