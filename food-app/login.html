<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FoodQA — Login</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="bg-flow"><div class="blob b1"></div><div class="blob b2"></div><div class="blob b3"></div><div class="bg-grid"></div></div>
<div id="loader"><div class="loader-food">🔐</div><div class="loader-bar"><i></i></div></div>
<div id="appHeader"></div>
<main class="wrap page-anim">
  <div class="auth-wrap">
    <div class="panel">
      <div class="auth-logo"><span class="big">🍔</span><h2 style="color:var(--purple-deep)">Welcome Back!</h2><p style="color:var(--muted);font-size:14px;margin-top:5px">Login to FoodQA to order your favourites</p></div>
      <div class="form-error" id="errBox"></div>
      <form id="loginForm">
        <div class="field"><label>📧 Email Address</label><input type="email" id="email" placeholder="you@example.com" required></div>
        <div class="field"><label>🔒 Password</label><input type="password" id="pass" placeholder="Enter your password" required></div>
        <button class="btn btn-orange btn-block" type="submit">🔐 Login →</button>
      </form>
      <p style="text-align:center;margin-top:18px;font-size:14px;color:var(--muted)">New to FoodQA? <a href="register.html" style="color:var(--purple-dark);font-weight:800">Create Account</a></p>
      <p style="text-align:center;margin-top:10px;font-size:12px;color:var(--muted)">Demo: register first, then login with the same email.</p>
    </div>
  </div>
</main>
<div id="appFooter"></div>
<script src="app.js"></script>
<script>
window.addEventListener('load',function(){setTimeout(function(){document.getElementById('loader').classList.add('done')},900)});
setTimeout(function(){document.getElementById('loader').classList.add('done')},2500);
FoodQA.mount('login');
if(FoodQA.currentUser()){location.href='index.html'}
document.getElementById('loginForm').addEventListener('submit',function(e){
  e.preventDefault();
  var email=document.getElementById('email').value.trim().toLowerCase();
  var pass=document.getElementById('pass').value;
  var res=FoodQA.loginUser(email,pass);
  var err=document.getElementById('errBox');
  if(!res.ok){err.textContent='⚠️ '+res.msg;err.classList.add('show');return}
  err.classList.remove('show');
  FoodQA.toast('👋 Welcome back, '+FoodQA.currentUser().name+'!');
  var next=FoodQA.getParam('next')||'index.html';
  setTimeout(function(){location.href=next},700);
});
</script>
</body>
</html>
