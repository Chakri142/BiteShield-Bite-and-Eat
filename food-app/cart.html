<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FoodQA — Cart</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="bg-flow"><div class="blob b1"></div><div class="blob b2"></div><div class="blob b3"></div><div class="bg-grid"></div></div>
<div id="loader"><div class="loader-food">🛒</div><div class="loader-bar"><i></i></div></div>
<div id="appHeader"></div>
<main class="wrap page-anim">
  <div class="sec-head"><h2>🛒 Your Cart</h2><p>Review items, apply coupons &amp; checkout</p></div>
  <div class="two-col">
    <div>
      <div id="cartList"></div>
      <div class="panel" style="margin-top:16px">
        <h3 style="color:var(--purple-deep);margin-bottom:6px">🎟️ Apply Coupon</h3>
        <p style="color:var(--muted);font-size:13px">Try: <b>FOOD50</b> (₹50 OFF) • <b>FIRST100</b> (₹100 OFF) • <b>FREEDEL</b> (Free delivery)</p>
        <div class="coupon-row"><input id="couponInput" placeholder="Enter coupon code"><button class="btn btn-primary btn-sm" onclick="applyCoupon()">Apply</button></div>
        <div class="form-ok" id="couponMsg"></div>
      </div>
    </div>
    <div class="panel">
      <h3 style="color:var(--purple-deep);margin-bottom:12px">🧾 Bill Details</h3>
      <div id="billBox"></div>
      <button class="btn btn-orange btn-block" style="margin-top:16px" onclick="goCheckout()">Proceed to Checkout →</button>
      <a class="btn btn-ghost btn-block" href="index.html" style="margin-top:10px">+ Add More Items</a>
    </div>
  </div>
</main>
<div id="appFooter"></div>
<script src="app.js"></script>
<script>
window.addEventListener('load',function(){setTimeout(function(){document.getElementById('loader').classList.add('done')},900)});
setTimeout(function(){document.getElementById('loader').classList.add('done')},2500);
FoodQA.mount('cart');
function renderCart(){
  var cart=FoodQA.getCart(),list=document.getElementById('cartList');
  if(!cart.length){list.innerHTML='<div class="empty"><span class="big">🛒</span><b>Your cart is empty.</b><br>Add some tasty food first!<br><a class="btn btn-orange" href="index.html" style="margin-top:16px">🍽️ Browse Restaurants</a></div>';document.getElementById('billBox').innerHTML='<div class="summary-row"><span>Subtotal</span><b>₹0</b></div>';return}
  var h='';
  cart.forEach(function(c){
    var f=FoodQA.findDish(c.id);if(!f)return;
    h+='<div class="cart-item"><div class="ci">'+f.dish.emoji+'</div><div><h4>'+f.dish.name+'</h4><small>'+f.rest.name+' • '+FoodQA.money(f.dish.price)+' each</small></div><div class="qty"><button onclick="changeQty(\''+c.id+'\',-1)">−</button><b>'+c.qty+'</b><button onclick="changeQty(\''+c.id+'\',1)">+</button></div><span class="amt">'+FoodQA.money(f.dish.price*c.qty)+'</span><button onclick="FoodQA.removeFromCart(\''+c.id+'\');renderCart()" style="background:none;border:none;font-size:17px">🗑️</button></div>';
  });
  list.innerHTML=h;
  var sub=FoodQA.cartTotal();
  var coupon=FoodQA.store('foodqa_coupon');
  var off=coupon?FoodQA.COUPONS[coupon].off:0;
  var del=sub>=499?0:30;
  var total=Math.max(0,sub-off)+del;
  document.getElementById('billBox').innerHTML=
    '<div class="summary-row"><span>Subtotal</span><b>'+FoodQA.money(sub)+'</b></div>'+
    (off?'<div class="summary-row"><span>Coupon ('+coupon+')</span><b style="color:#047857">−'+FoodQA.money(off)+'</b></div>':'')+
    '<div class="summary-row"><span>Delivery</span><b>'+(del?FoodQA.money(del):'FREE')+'</b></div>'+
    (sub<499?'<div style="font-size:12px;color:var(--muted)">Add '+FoodQA.money(499-sub)+' more for FREE delivery</div>':'')+
    '<div class="summary-row total"><span>Total</span><span>'+FoodQA.money(total)+'</span></div>';
}
function changeQty(id,d){var cart=FoodQA.getCart();for(var i=0;i<cart.length;i++)if(cart[i].id===id)cart[i].qty+=d;cart=cart.filter(function(c){return c.qty>0});FoodQA.saveCart(cart);renderCart()}
function applyCoupon(){
  var code=document.getElementById('couponInput').value.trim().toUpperCase();
  var msg=document.getElementById('couponMsg');
  if(FoodQA.COUPONS[code]){FoodQA.store('foodqa_coupon',code);msg.textContent='✅ '+FoodQA.COUPONS[code].desc;msg.classList.add('show');FoodQA.toast('🎟️ Coupon applied!')}
  else{msg.textContent='⚠️ Invalid coupon code.';msg.classList.add('show')}
  renderCart();
}
function goCheckout(){
  if(!FoodQA.getCart().length){FoodQA.toast('🛒 Cart is empty!');return}
  if(!FoodQA.requireLogin('checkout.html'))return;
  location.href='checkout.html';
}
renderCart();
</script>
</body>
</html>
