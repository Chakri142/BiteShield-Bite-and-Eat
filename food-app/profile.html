<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FoodQA — Profile</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="bg-flow"><div class="blob b1"></div><div class="blob b2"></div><div class="blob b3"></div><div class="bg-grid"></div></div>
<div id="loader"><div class="loader-food">👤</div><div class="loader-bar"><i></i></div></div>
<div id="appHeader"></div>
<main class="wrap page-anim">
  <div class="sec-head"><h2>👤 My Profile</h2><p>Your FoodQA account (synced across pages)</p></div>
  <div id="profileBox"></div>
</main>
<div id="appFooter"></div>
<script src="app.js"></script>
<script>
window.addEventListener('load',function(){setTimeout(function(){document.getElementById('loader').classList.add('done')},900)});
setTimeout(function(){document.getElementById('loader').classList.add('done')},2500);
FoodQA.mount('profile');
var u=FoodQA.currentUser();
var box=document.getElementById('profileBox');
if(!u){box.innerHTML='<div class="empty"><span class="big">🔐</span><b>You are not logged in.</b><br>Login to see your profile.<br><a class="btn btn-orange" href="login.html" style="margin-top:16px">🔐 Login</a> <a class="btn btn-ghost" href="register.html" style="margin-top:16px">📝 Register</a></div>'}
else{
  var orders=FoodQA.getOrders();
  var spent=orders.reduce(function(s,o){return s+o.total},0);
  var initials=u.name.split(' ').map(function(w){return w[0]}).join('').slice(0,2).toUpperCase();
  box.innerHTML='<div class="panel" style="text-align:center;padding:36px"><div style="width:92px;height:92px;margin:0 auto 14px;border-radius:50%;background:linear-gradient(135deg,var(--purple),var(--orange));display:flex;align-items:center;justify-content:center;font-size:34px;font-weight:900;color:#fff;box-shadow:var(--shadow)">'+FoodQA.esc(initials)+'</div><h3 style="color:var(--purple-deep);font-size:22px">'+FoodQA.esc(u.name)+'</h3><p style="color:var(--muted);font-size:14px;margin-top:5px">📧 '+FoodQA.esc(u.email)+' • 📱 '+FoodQA.esc(u.phone||'-')+'</p><div style="display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin:20px 0"><span class="pill gray" style="font-size:13px;padding:8px 16px">📦 '+orders.length+' Orders</span><span class="pill gray" style="font-size:13px;padding:8px 16px">💰 '+FoodQA.money(spent)+' Spent</span><span class="pill gray" style="font-size:13px;padding:8px 16px">🛒 '+FoodQA.cartCount()+' in Cart</span></div><div style="display:flex;gap:10px;justify-content:center;flex-wrap:wrap"><a class="btn btn-primary btn-sm" href="orders.html">📦 My Orders</a><a class="btn btn-ghost btn-sm" href="index.html">🍽️ Order Food</a><button class="btn btn-orange btn-sm" onclick="FoodQA.logout()">👋 Logout</button></div></div>';
}
</script>
</body>
</html>
